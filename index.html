<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blackjack Card Counter</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <h1>Blackjack Card Counter</h1>
  <div class="cards">
    <h2>Select a Card</h2>
    <div id="card-deck"></div>
  </div>

  <div class="hands">
    <div>
      <h2>Dealer's Hand</h2>
      <div id="dealer-hand" class="hand"></div>
    </div>
    <div>
      <h2>Player's Hand</h2>
      <div id="player-hand" class="hand"></div>
    </div>
  </div>

  <div id="counter">
    <p>Running Count: <span id="count">0</span></p>
  </div>

  <div class="buttons">
    <button onclick="resetHand()">Reset Hand</button>
    <button onclick="resetShoe()">Reset Shoe</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
